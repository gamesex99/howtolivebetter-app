<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>高性價比人生指南 · 個人行動版</title>
  <meta name="description" content="基於《高性價比人生指南》的純前端個人進度追蹤工具" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root, [data-theme="dark"] {
      --bg:#0f1419; --card:#1a2332; --card-hover:#243044; --border:#2d3a4f;
      --text:#e7ecf3; --muted:#8b9bb4; --accent:#3b82f6; --accent2:#22c55e;
      --warn:#f59e0b; --radius:12px;
      --daily:linear-gradient(135deg,#1e3a5f,#1a2332);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    [data-theme="light"] {
      --bg:#f4f6f9; --card:#fff; --card-hover:#f0f4f8; --border:#d1d9e6;
      --text:#1a2332; --muted:#64748b; --accent:#2563eb; --accent2:#16a34a;
      --warn:#d97706; --daily:linear-gradient(135deg,#dbeafe,#eff6ff);
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
      background:var(--bg);color:var(--text);line-height:1.55;min-height:100vh;
      padding-bottom:calc(64px + var(--safe-bottom));
    }
    .container{max-width:720px;margin:0 auto;padding:12px 14px 24px}
    header{
      display:flex;justify-content:space-between;align-items:center;
      padding:12px 0 10px;border-bottom:1px solid var(--border);margin-bottom:12px;gap:8px;
    }
    header h1{font-size:1.15rem;font-weight:700}
    header .sub{font-size:0.75rem;color:var(--muted)}
    .icon-btn{
      width:36px;height:36px;border-radius:10px;border:1px solid var(--border);
      background:var(--card);color:var(--text);cursor:pointer;font-size:1.1rem;
      display:flex;align-items:center;justify-content:center;
    }
    .menu-wrap{position:relative}
    .menu-panel{
      display:none;position:absolute;right:0;top:40px;z-index:50;
      background:var(--card);border:1px solid var(--border);border-radius:12px;
      min-width:180px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.25);
    }
    .menu-panel.open{display:block}
    .menu-panel button, .menu-panel label{
      display:block;width:100%;text-align:left;padding:10px 12px;border:none;
      background:transparent;color:var(--text);font-size:0.9rem;cursor:pointer;border-radius:8px;
    }
    .menu-panel button:hover, .menu-panel label:hover{background:var(--card-hover)}
    .menu-panel select{
      width:100%;padding:8px 10px;margin:4px 0 8px;border-radius:8px;
      border:1px solid var(--border);background:var(--bg);color:var(--text);
    }

    #setup{
      background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:18px;margin-bottom:16px;
    }
    #setup h2{font-size:1.05rem;margin-bottom:12px}
    .form-row{margin-bottom:12px}
    .form-row label{display:block;color:var(--muted);font-size:0.8rem;margin-bottom:4px}
    select,input[type=search]{
      padding:9px 11px;border-radius:8px;border:1px solid var(--border);
      background:var(--bg);color:var(--text);font-size:0.92rem;
    }
    select{width:100%;max-width:280px}
    .chips{display:flex;flex-wrap:wrap;gap:6px}
    .chip{
      padding:5px 12px;border-radius:999px;border:1px solid var(--border);
      background:transparent;color:var(--text);cursor:pointer;font-size:0.85rem;
    }
    .chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
    .btn{
      display:inline-block;padding:9px 16px;border-radius:8px;border:none;
      background:var(--accent);color:#fff;font-size:0.9rem;cursor:pointer;font-weight:600;
    }
    .btn:hover{opacity:.92}
    .btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text)}
    .btn-sm{padding:5px 11px;font-size:0.8rem}
    .btn-block{width:100%;margin-top:8px}

    .daily-card{
      background:var(--daily);border:1px solid var(--accent);border-radius:var(--radius);
      padding:14px;margin-bottom:12px;
    }
    .daily-label{font-size:0.7rem;color:var(--accent);font-weight:600;margin-bottom:2px}
    .daily-title{font-size:1.02rem;font-weight:700;margin-bottom:4px}
    .daily-say{color:var(--muted);font-size:0.88rem;margin-bottom:8px}
    .daily-actions{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
    .daily-meta{font-size:0.72rem;color:var(--muted)}

    .stats{
      display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;
    }
    .stat-card{
      background:var(--card);border:1px solid var(--border);border-radius:10px;
      padding:10px 6px;text-align:center;
    }
    .stat-card .num{font-size:1.25rem;font-weight:700;color:var(--accent2)}
    .stat-card .label{font-size:0.68rem;color:var(--muted)}

    .chapter-stats{
      display:none;background:var(--card);border:1px solid var(--border);
      border-radius:var(--radius);padding:12px;margin-bottom:10px;
    }
    .chapter-stats.show{display:block}
    .chapter-stats h3{font-size:0.8rem;color:var(--muted);margin-bottom:8px}
    .ch-bar{display:flex;align-items:center;gap:6px;margin-bottom:5px;font-size:0.75rem;cursor:pointer}
    .ch-bar:hover .name{color:var(--accent)}
    .ch-bar .name{width:110px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .ch-bar .track{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden}
    .ch-bar .fill{height:100%;background:var(--accent2);border-radius:4px}
    .ch-bar .pct{width:36px;text-align:right;color:var(--muted)}

    .scenario-bar{
      display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px;
      -webkit-overflow-scrolling:touch;scrollbar-width:none;
    }
    .scenario-bar::-webkit-scrollbar{display:none}
    .scenario-btn{
      flex-shrink:0;padding:5px 11px;border-radius:999px;border:1px solid var(--border);
      background:var(--card);color:var(--text);font-size:0.78rem;cursor:pointer;
    }
    .scenario-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}

    .toolbar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;align-items:center}
    .toolbar input[type=search]{flex:1;min-width:140px}
    .filters{display:flex;flex-wrap:wrap;gap:5px}
    .filters select{width:auto;max-width:none;padding:7px 8px;font-size:0.8rem}

    .toggle-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px;align-items:center}
    .toggle{display:flex;align-items:center;gap:4px;font-size:0.8rem;color:var(--muted);cursor:pointer}
    .toggle input{accent-color:var(--accent);width:15px;height:15px}

    .list{display:flex;flex-direction:column;gap:8px}
    .item{
      background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
      padding:12px;transition:border-color .15s, opacity .15s;
    }
    .item.done{opacity:.6;border-color:var(--accent2)}
    .item.fav{border-color:var(--warn)}
    .item-top{display:flex;gap:8px;align-items:flex-start}
    .item-top input[type=checkbox]{
      width:18px;height:18px;margin-top:2px;cursor:pointer;accent-color:var(--accent2);flex-shrink:0;
    }
    .item-main{flex:1;min-width:0}
    .item-title-row{display:flex;align-items:flex-start;gap:4px}
    .item-title{font-weight:600;font-size:0.95rem;flex:1;cursor:pointer}
    .star-btn{
      background:none;border:none;cursor:pointer;font-size:1.15rem;color:var(--muted);
      padding:0 2px;line-height:1;flex-shrink:0;
    }
    .star-btn.on{color:var(--warn)}
    .chev{
      background:none;border:none;color:var(--muted);cursor:pointer;font-size:0.85rem;
      padding:2px 4px;flex-shrink:0;
    }
    .item-meta{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
    .tag{
      font-size:0.68rem;padding:1px 6px;border-radius:4px;
      background:var(--border);color:var(--muted);
    }
    .tag.a{background:#14532d;color:#86efac}
    .tag.b{background:#713f12;color:#fde68a}
    .tag.c{background:#44403c;color:#d6d3d1}
    [data-theme=light] .tag.a{background:#dcfce7;color:#166534}
    [data-theme=light] .tag.b{background:#fef3c7;color:#92400e}
    [data-theme=light] .tag.c{background:#e7e5e4;color:#57534e}
    .tag.cost0{background:#164e63;color:#67e8f9}
    [data-theme=light] .tag.cost0{background:#cffafe;color:#0e7490}
    .item-body{display:none;margin-top:8px}
    .item.open .item-body{display:block}
    .item.open .chev{transform:rotate(180deg)}
    .say{color:var(--muted);font-size:0.88rem;margin-bottom:4px}
    .cost-benefit{font-size:0.8rem;color:var(--muted)}
    .lang-note{
      font-size:0.75rem;color:var(--muted);background:var(--card);
      border:1px dashed var(--border);border-radius:8px;padding:8px 10px;margin-bottom:10px;
    }

    .toast{
      position:fixed;bottom:calc(72px + var(--safe-bottom));left:50%;
      transform:translateX(-50%) translateY(20px);background:var(--accent2);color:#fff;
      padding:8px 16px;border-radius:999px;font-weight:600;font-size:0.88rem;
      opacity:0;transition:all .25s;z-index:100;pointer-events:none;white-space:nowrap;
    }
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

    /* bottom nav mobile */
    .bottom-nav{
      position:fixed;left:0;right:0;bottom:0;z-index:40;
      background:var(--card);border-top:1px solid var(--border);
      display:flex;justify-content:space-around;padding:6px 4px calc(6px + var(--safe-bottom));
    }
    .bottom-nav button{
      flex:1;background:none;border:none;color:var(--muted);font-size:0.68rem;
      cursor:pointer;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;
    }
    .bottom-nav button .ico{font-size:1.15rem}
    .bottom-nav button:active{color:var(--accent)}

    footer{
      margin-top:28px;padding:14px 0;border-top:1px solid var(--border);
      font-size:0.72rem;color:var(--muted);text-align:center;
    }
    footer a{color:var(--accent)}
    .hidden{display:none!important}

    @media(min-width:768px){
      body{padding-bottom:24px}
      .bottom-nav{display:none}
      .container{max-width:800px}
    }
  </style>
</head>
<body data-theme="dark">
  <div class="container">
    <header>
      <div>
        <h1 id="appTitle">人生指南</h1>
        <div class="sub" id="appSub">個人行動版</div>
      </div>
      <div class="menu-wrap">
        <button class="icon-btn" id="menuBtn" aria-label="menu">⋯</button>
        <div class="menu-panel" id="menuPanel">
          <label>語言 / Language
            <select id="langSel">
              <option value="zh-Hant">繁體中文</option>
              <option value="zh-Hans">简体中文</option>
              <option value="en">English</option>
            </select>
          </label>
          <button type="button" id="themeBtn">亮色主題</button>
          <button type="button" id="loadFullBtn">載入完整數據</button>
          <button type="button" id="clearFullBtn">恢復精選（清快取）</button>
          <button type="button" id="exportBtn">匯出進度</button>
          <button type="button" id="importBtn">匯入進度</button>
          <input type="file" id="importFile" accept=".json" class="hidden" />
        </div>
      </div>
    </header>

    <section id="setup">
      <h2 id="setupTitle">先設定你的情況</h2>
      <div class="form-row">
        <label id="stageLabel">人生階段</label>
        <select id="stage">
          <option value="student">高中 / 大學生</option>
          <option value="early">剛工作（約 22–30 歲）</option>
          <option value="mid" selected>中年（約 30–50 歲）</option>
          <option value="senior">50 歲以上 / 退休前後</option>
        </select>
      </div>
      <div class="form-row">
        <label id="sitLabel">個人情況（可多選）</label>
        <div class="chips" id="situations">
          <button type="button" class="chip" data-val="has_kids">有小孩</button>
          <button type="button" class="chip" data-val="pregnant">懷孕 / 備孕</button>
          <button type="button" class="chip" data-val="chronic">有慢性病</button>
          <button type="button" class="chip" data-val="unemployed">失業 / 求職中</button>
          <button type="button" class="chip" data-val="rent">租房</button>
          <button type="button" class="chip" data-val="own_house">已買房</button>
          <button type="button" class="chip" data-val="tech">做技術 / 程式相關</button>
        </div>
      </div>
      <button class="btn btn-block" id="startBtn">開始使用</button>
    </section>

    <section id="main" class="hidden">
      <div id="langNote" class="lang-note hidden"></div>
      <div id="dailyCard" class="daily-card"></div>
      <div class="stats" id="stats"></div>
      <div class="chapter-stats" id="chapterStats"></div>
      <div class="scenario-bar" id="scenarioBar">
        <button class="scenario-btn active" data-scene="">全部</button>
        <button class="scenario-btn" data-scene="layoff">被裁之後</button>
        <button class="scenario-btn" data-scene="money">省錢理財</button>
        <button class="scenario-btn" data-scene="health">健康長壽</button>
        <button class="scenario-btn" data-scene="legal">法律風險</button>
        <button class="scenario-btn" data-scene="family">家庭育兒</button>
        <button class="scenario-btn" data-scene="career">工作技能</button>
      </div>
      <div class="toggle-row" id="toggleRow">
        <label class="toggle"><input type="checkbox" id="onlyMine" /> 只睇適合我</label>
        <label class="toggle"><input type="checkbox" id="onlyFav" /> 只睇收藏</label>
        <label class="toggle"><input type="checkbox" id="showChStats" /> 章節完成率</label>
      </div>
      <div class="toolbar">
        <input type="search" id="search" placeholder="搜尋…" />
        <div class="filters">
          <select id="filterChapter"><option value="">全部章節</option></select>
          <select id="filterEvidence">
            <option value="">證據</option>
            <option value="A">A</option>
            <option value="B">B</option>
            <option value="C">C</option>
          </select>
          <select id="filterCost">
            <option value="">成本</option>
            <option value="0">不花錢</option>
            <option value="少">少錢</option>
          </select>
          <select id="filterDone">
            <option value="">狀態</option>
            <option value="todo">未完成</option>
            <option value="done">已完成</option>
          </select>
        </div>
      </div>
      <div class="list" id="list"></div>
    </section>

    <footer id="footer">
      內容改編自 <a href="https://github.com/eternity4719/HowToLiveBetter" target="_blank" rel="noopener">HowToLiveBetter</a>（CC BY 4.0）。
      完整數據可選載 <a href="https://github.com/sin0317/htlb-dataset" target="_blank" rel="noopener">htlb-dataset</a>。<br>
      進度只存本機。健康／法律請以專業意見為準。
    </footer>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button type="button" id="navSearch"><span class="ico">🔍</span><span data-nav="search">搜尋</span></button>
    <button type="button" id="navRandom"><span class="ico">🎲</span><span data-nav="random">挑戰</span></button>
    <button type="button" id="navFav"><span class="ico">★</span><span data-nav="fav">收藏</span></button>
    <button type="button" id="navMenu"><span class="ico">⋯</span><span data-nav="more">更多</span></button>
  </nav>

  <div class="toast" id="toast"></div>

  <script>
const ENTRIES = [
      // ===== 01 不要早死 =====
      { id:"01-01", chapter:"01-不要早死", title:"戒煙，越早越好", say:"吸煙的人平均比不吸煙的人少活十年以上。40歲前戒掉，能把繼續吸煙帶來的死亡風險抹掉九成左右。", cost:"不花錢，反而省錢。難在戒斷期要熬。", benefit:"預期壽命多約10年（25–34歲戒）", evidence:"A", money:"0", time:"少", will:"是", stages:["early","mid","senior"], tags:[] },
      { id:"01-02", chapter:"01-不要早死", title:"別在家裡和車裡抽煙，也別讓客人抽", say:"全球每年約60萬人死於二手煙，其中近三成是孩子。", cost:"不花錢。難在要開口讓家人別抽。", benefit:"降低全家心血管與癌症風險", evidence:"A", money:"0", time:"少", will:"些", stages:["early","mid","senior"], tags:["has_kids"] },
      { id:"01-03", chapter:"01-不要早死", title:"注意燃氣安全（定期檢查、裝報警器）", say:"燃氣事故後果極嚴重，預防成本很低。", cost:"報警器與檢查費用不高。", benefit:"大幅降低致命風險", evidence:"A", money:"少", time:"少", will:"否", stages:["early","mid","senior"], tags:["own_house","rent"] },
      { id:"01-04", chapter:"01-不要早死", title:"不要採食野生蘑菇", say:"每年都有因野生蘑菇中毒死亡的案例，土辦法試毒不可靠。", cost:"不花錢。", benefit:"避免中毒死亡", evidence:"A", money:"0", time:"少", will:"否", stages:["early","mid","senior"], tags:[] },
      { id:"01-05", chapter:"01-不要早死", title:"上車系安全帶、騎車戴頭盔", say:"交通意外是年輕人重要死因，預防措施證據明確。", cost:"不花錢或買頭盔一次。", benefit:"大幅降低重傷與死亡風險", evidence:"A", money:"少", time:"少", will:"否", stages:["student","early","mid","senior"], tags:[] },

      // ===== 02 不要慢慢死 =====
      { id:"02-01", chapter:"02-不要慢慢死", title:"把家裡的食鹽換成低鈉鹽（鉀鹽）", say:"兩萬人隨機試驗：換成低鈉鹽的人五年內死亡概率低約12%，中風低約14%。", cost:"每袋貴幾元，買時順手換。", benefit:"總死亡率↓12%，中風↓14%", evidence:"A", money:"少", time:"少", will:"否", stages:["early","mid","senior"], tags:[] },
      { id:"02-02", chapter:"02-不要慢慢死", title:"每天吃一小把堅果（約28克）", say:"常吃堅果的人同期死亡概率比不吃的人低約兩成。", cost:"一年約兩三百元。", benefit:"總死亡率降低約20%", evidence:"A", money:"少", time:"少", will:"否", stages:["early","mid","senior"], tags:[] },
      { id:"02-03", chapter:"02-不要慢慢死", title:"每天走到7000–8000步", say:"走路是成本極低、證據很硬的長壽行為。", cost:"不花錢，需要時間。", benefit:"降低總死亡率與多種慢性病風險", evidence:"A", money:"0", time:"中", will:"些", stages:["early","mid","senior"], tags:[] },
      { id:"02-04", chapter:"02-不要慢慢死", title:"每晚睡大約7小時", say:"睡眠過少或過多都與更高死亡率相關。", cost:"不花錢，要改作息。", benefit:"精力與長期健康", evidence:"A", money:"0", time:"少", will:"些", stages:["student","early","mid","senior"], tags:[] },
      { id:"02-05", chapter:"02-不要慢慢死", title:"不喝含糖飲料", say:"含糖飲料與肥胖、糖尿病、心血管風險上升有關。", cost:"不花錢（改喝水）。", benefit:"降低代謝疾病風險", evidence:"A", money:"0", time:"少", will:"些", stages:["student","early","mid"], tags:[] },
      { id:"02-06", chapter:"02-不要慢慢死", title:"少吃加工肉（香腸、培根等）", say:"加工肉與大腸癌等風險上升有明確關聯。", cost:"不花錢。", benefit:"降低癌症風險", evidence:"A", money:"0", time:"少", will:"些", stages:["early","mid","senior"], tags:[] },

    const FULL_CACHE_KEY = 'htlb_full_entries_v2';
    const FULL_FLAG_KEY = 'htlb_use_full_v2';

    function idbOpen() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('htlb_db_v2', 1);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('kv')) db.createObjectStore('kv');
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbSet(key, value) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').put(value, key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }
    async function idbGet(key) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readonly');
        const req = tx.objectStore('kv').get(key);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }
    async function idbDel(key) {
      const db = await idbOpen();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('kv', 'readwrite');
        tx.objectStore('kv').delete(key);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
    }

    async function saveFullCache(items) {
      await idbSet(FULL_CACHE_KEY, items);
      localStorage.setItem(FULL_FLAG_KEY, '1');
      localStorage.setItem(FULL_FLAG_KEY + '_n', String(items.length));
      localStorage.setItem(FULL_FLAG_KEY + '_at', new Date().toISOString());
    }
    async function loadFullCache() {
      if (localStorage.getItem(FULL_FLAG_KEY) !== '1') return null;
      try {
        const items = await idbGet(FULL_CACHE_KEY);
        if (Array.isArray(items) && items.length > 50) return items;
      } catch (e) { console.warn(e); }
      return null;
    }
    async function clearFullCache() {
      try { await idbDel(FULL_CACHE_KEY); } catch(e) {}
      localStorage.removeItem(FULL_FLAG_KEY);
      localStorage.removeItem(FULL_FLAG_KEY + '_n');
      localStorage.removeItem(FULL_FLAG_KEY + '_at');
    }

      family:["孩子","嬰兒","懷孕","葉酸","仰睡","老人","跌倒","养","婴儿","怀孕"],
      career:["技能","證書","通勤","會議","私活","平台","夜班","專注","证书","会议"]
    };

    const STORAGE_KEY="htlb_progress_v1", FAV_KEY="htlb_fav_v1", PROFILE_KEY="htlb_profile_v1";
    const THEME_KEY="htlb_theme_v1", LANG_KEY="htlb_lang_v1";

    let profile=JSON.parse(localStorage.getItem(PROFILE_KEY)||"null");
    let progress=JSON.parse(localStorage.getItem(STORAGE_KEY)||"{}");
    let favs=JSON.parse(localStorage.getItem(FAV_KEY)||"{}");
    let currentScene="", tempDailyId=null, openIds=new Set();
    let lang=localStorage.getItem(LANG_KEY)||"zh-Hant";

    const $ = id => document.getElementById(id);
    const setupEl=$("setup"), mainEl=$("main"), listEl=$("list"), statsEl=$("stats");
    const chapterStatsEl=$("chapterStats"), dailyCardEl=$("dailyCard"), toastEl=$("toast");
    const menuBtn=$("menuBtn"), menuPanel=$("menuPanel");

    function t(k){ return (I18N[lang]||I18N["zh-Hant"])[k] ?? k; }
    function toast(msg){ toastEl.textContent=msg; toastEl.classList.add("show"); setTimeout(()=>toastEl.classList.remove("show"),1600); }

    // theme
    const savedTheme=localStorage.getItem(THEME_KEY)||"dark";
    document.body.setAttribute("data-theme", savedTheme);

    menuBtn.onclick = e => { e.stopPropagation(); menuPanel.classList.toggle("open"); };
    document.addEventListener("click", () => menuPanel.classList.remove("open"));
    menuPanel.onclick = e => e.stopPropagation();

    $("themeBtn").onclick = () => {
      const next = document.body.getAttribute("data-theme")==="dark" ? "light" : "dark";
      document.body.setAttribute("data-theme", next);
      localStorage.setItem(THEME_KEY, next);
      applyChrome();
    };

    $("langSel").value = lang;
    $("langSel").onchange = () => {
      lang = $("langSel").value;
      localStorage.setItem(LANG_KEY, lang);
      applyChrome();
      render();
    };

    // chips
    $("situations").querySelectorAll(".chip").forEach(c => c.onclick = () => c.classList.toggle("active"));
    function getSits(){ return [...$("situations").querySelectorAll(".chip.active")].map(c=>c.dataset.val); }

    $("startBtn").onclick = () => {
      profile = { stage: $("stage").value, situations: getSits() };
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      showMain();
    };

    function showMain(){
      setupEl.classList.add("hidden");
      mainEl.classList.remove("hidden");
      populateChapters();
      applyChrome();
      render();
    }
    if (profile) {
      $("stage").value = profile.stage || "mid";
      (profile.situations||[]).forEach(s => {
        const c = $("situations").querySelector(`[data-val="${s}"]`);
        if (c) c.classList.add("active");
      });
      showMain();
    }

    function saveProgress(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
    function saveFavs(){ localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }

    $("exportBtn").onclick = () => {
      const data = { version:1, exportedAt:new Date().toISOString(), profile, progress, favs };
      const a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
      a.download = `htlb-progress-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      toast(t("exported"));
      menuPanel.classList.remove("open");
    };
    $("importBtn").onclick = () => { $("importFile").click(); };
    $("importFile").onchange = e => {
      const f = e.target.files[0]; if (!f) return;
      const r = new FileReader();
      r.onload = () => {
        try {
          const d = JSON.parse(r.result);
          if (d.progress) progress = d.progress;
          if (d.favs) favs = d.favs;
          if (d.profile) { profile = d.profile; localStorage.setItem(PROFILE_KEY, JSON.stringify(profile)); }
          saveProgress(); saveFavs();
          toast(t("imported"));
          if (profile) showMain(); else render();
        } catch { alert("Invalid JSON"); }
      };
      r.readAsText(f); $("importFile").value = "";
      menuPanel.classList.remove("open");
    };

    // full dataset
    function mapDatasetItem(it) {
      const sec = it.section_title || ("第"+it.section+"节");
      return {
        id: String(it.id),
        chapter: String(it.section).padStart(2,"0")+"-"+sec,
        title: it.title||"",
        say: it.plain||"",
        cost: it.cost_text||"",
        benefit: it.benefit_text || it.benefit_level || "",
        evidence: (it.evidence||"C").charAt(0).toUpperCase(),
        money: (it.cost_money==="0"||it.cost_money===0) ? "0" : (it.cost_money||"少"),
        time: it.cost_time||"少",
        will: it.cost_willpower||"否",
        stages: ["student","early","mid","senior"],
        tags: []
      };
    }
    function applyEntries(list) {
      ENTRIES.length = 0;
      list.forEach(e => ENTRIES.push(e));
      populateChapters();
      tempDailyId = null;
      if (typeof render === "function") render();
    }
    async function loadFullDataset() {
      const btn = $("loadFullBtn");
      if (btn) { btn.disabled = true; btn.textContent = t("loading"); }
      try {
        let res = await fetch("https://cdn.jsdelivr.net/gh/sin0317/htlb-dataset@main/data/htlb.json");
        if (!res.ok) res = await fetch("https://raw.githubusercontent.com/sin0317/htlb-dataset/main/data/htlb.json");
        if (!res.ok) throw new Error("http");
        const data = await res.json();
        const items = data.items || data;
        if (!Array.isArray(items) || !items.length) throw new Error("empty");
        const mapped = items.map(mapDatasetItem);
        applyEntries(mapped);
        await saveFullCache(mapped);
        toast(t("loadOk")+" ("+ENTRIES.length+")");
      } catch(e) {
        console.error(e); toast(t("loadFail"));
      } finally {
        if (btn) { btn.disabled=false; }
        applyChrome();
        menuPanel.classList.remove("open");
      }
    }
    $("loadFullBtn").onclick = loadFullDataset;
    const clearFullBtn = $("clearFullBtn");
    if (clearFullBtn) {
      clearFullBtn.onclick = async () => {
        await clearFullCache();
        applyEntries(BUILTIN_ENTRIES.map(e => ({...e})));
        toast(lang==="en" ? "Back to curated list" : (lang==="zh-Hans" ? "已恢复精选" : "已恢復精選"));
        applyChrome();
        menuPanel.classList.remove("open");
      };
    }

    // 啟動時：若有本機全量快取，自動使用
    (async function restoreFullIfCached() {
      try {
        const cached = await loadFullCache();
        if (cached) {
          applyEntries(cached);
          console.log("[htlb] restored full cache", cached.length);
        }
      } catch (e) { console.warn(e); }
    })();

    function applyChrome() {
      $("appTitle").textContent = t("title");
      $("appSub").textContent = t("sub");
      const isDark = document.body.getAttribute("data-theme")==="dark";
      $("themeBtn").textContent = isDark ? t("theme") : t("themeDark");
      $("loadFullBtn").textContent = t("loadFull");
      const cfb = $("clearFullBtn");
      if (cfb) cfb.textContent = lang==="en" ? "Curated only (clear cache)" : (lang==="zh-Hans" ? "恢复精选（清缓存）" : "恢復精選（清快取）");
      $("exportBtn").textContent = t("export");
      $("importBtn").textContent = t("import");
      $("setupTitle").textContent = t("setupTitle");
      $("stageLabel").textContent = t("stageLabel");
      $("sitLabel").textContent = t("sitLabel");
      $("startBtn").textContent = t("start");
      $("search").placeholder = t("searchPh");
      // toggles
      const om=$("onlyMine"), of=$("onlyFav"), sc=$("showChStats");
      const omc=om&&om.checked, ofc=of&&of.checked, scc=sc&&sc.checked;
      $("toggleRow").innerHTML = `
        <label class="toggle"><input type="checkbox" id="onlyMine" ${omc?"checked":""}/> ${t("onlyMine")}</label>
        <label class="toggle"><input type="checkbox" id="onlyFav" ${ofc?"checked":""}/> ${t("onlyFav")}</label>
        <label class="toggle"><input type="checkbox" id="showChStats" ${scc?"checked":""}/> ${t("showCh")}</label>`;
      $("onlyMine").onchange = render;
      $("onlyFav").onchange = render;
      $("showChStats").onchange = render;
      // scenes
      $("scenarioBar").querySelectorAll(".scenario-btn").forEach(btn => {
        const scn = btn.dataset.scene||"";
        const scenes = (I18N[lang]||I18N["zh-Hant"]).scenes||{};
        if (scenes[scn]!=null) btn.textContent = scenes[scn];
      });
      // bottom nav
      document.querySelector('[data-nav="search"]').textContent = t("navSearch");
      document.querySelector('[data-nav="random"]').textContent = t("navRandom");
      document.querySelector('[data-nav="fav"]').textContent = t("navFav");
      document.querySelector('[data-nav="more"]').textContent = t("navMore");
      // note
      const note = $("langNote");
      if (lang==="en" && t("enNote")) { note.textContent = t("enNote"); note.classList.remove("hidden"); }
      else if (lang==="zh-Hans" && t("hansNote")) { note.textContent = t("hansNote"); note.classList.remove("hidden"); }
      else note.classList.add("hidden");
      document.documentElement.lang = lang === "en" ? "en" : (lang === "zh-Hans" ? "zh-Hans" : "zh-Hant");
    }

    function isRelevant(e) {
      if (!profile || !$("onlyMine") || !$("onlyMine").checked) return true;
      if (e.stages && e.stages.length && !e.stages.includes(profile.stage)) return false;
      if (e.tags && e.tags.length) return e.tags.some(t => (profile.situations||[]).includes(t));
      return true;
    }
    function score(e) {
      let s=0;
      if (profile && e.stages && e.stages.includes(profile.stage)) s+=10;
      if (profile && e.tags) e.tags.forEach(t => { if ((profile.situations||[]).includes(t)) s+=20; });
      if (e.evidence==="A") s+=5;
      if (e.money==="0") s+=3;
      if (favs[e.id]) s+=15;
      return s;
    }
    function populateChapters() {
      const ch=[...new Set(ENTRIES.map(e=>e.chapter))].sort();
      $("filterChapter").innerHTML = '<option value="">'+disp(lang==="en"?"Chapters":"全部章節")+'</option>' +
        ch.map(c=>`<option value="${c}">${disp(c)}</option>`).join("");
    }
    function getDailyEntry() {
      const today=new Date().toISOString().slice(0,10);
      const seed=today.split("-").reduce((a,b)=>a+parseInt(b,10),0);
      if (tempDailyId) {
        const f=ENTRIES.find(e=>e.id===tempDailyId);
        if (f) return f;
      }
      const cand=ENTRIES.filter(e=>!progress[e.id]).sort((a,b)=>{
        const sa=(a.evidence==="A"?10:0)+(a.money==="0"?5:0)+score(a);
        const sb=(b.evidence==="A"?10:0)+(b.money==="0"?5:0)+score(b);
        return sb-sa;
      });
      if (!cand.length) return ENTRIES[seed%ENTRIES.length];
      return cand[seed%cand.length];
    }
    function renderDaily() {
      const e=getDailyEntry(); if (!e){ dailyCardEl.innerHTML=""; return; }
      const done=!!progress[e.id];
      dailyCardEl.innerHTML = `
        <div class="daily-label">${t("daily")} · ${new Date().toLocaleDateString(lang==="en"?"en-US":"zh-HK")}</div>
        <div class="daily-title">${disp(e.title)}</div>
        <p class="daily-say">${disp(e.say)}</p>
        <div class="daily-actions">
          <button class="btn btn-sm" id="dailyDoneBtn">${done?t("doneYes"):t("done")}</button>
          <button class="btn btn-secondary btn-sm" id="dailyAnotherBtn">${t("swap")}</button>
          <span class="daily-meta">${e.evidence} · ${e.money==="0"?(lang==="en"?"Free":"不花"):disp(e.money)} · ${disp(e.chapter)}</span>
        </div>`;
      $("dailyDoneBtn").onclick=()=>{
        if (progress[e.id]) delete progress[e.id];
        else { progress[e.id]=Date.now(); toast(t("doneYes")); }
        saveProgress(); tempDailyId=null; render();
      };
      $("dailyAnotherBtn").onclick=()=>{
        const others=ENTRIES.filter(x=>x.id!==e.id&&!progress[x.id]);
        tempDailyId=(others[Math.floor(Math.random()*others.length)]||e).id;
        renderDaily();
      };
    }
    function matchScene(e) {
      if (!currentScene) return true;
      const keys=SCENES[currentScene]||[];
      const text=e.title+e.say+e.chapter;
      return keys.some(k=>text.includes(k));
    }
    function getFiltered() {
      const q=($("search").value||"").trim().toLowerCase();
      const ch=$("filterChapter").value, ev=$("filterEvidence").value;
      const cost=$("filterCost").value, done=$("filterDone").value;
      const onlyFav=$("onlyFav")&&$("onlyFav").checked;
      return ENTRIES.filter(e=>{
        if (q && !(e.title+e.say+e.chapter).toLowerCase().includes(q)) return false;
        if (ch && e.chapter!==ch) return false;
        if (ev && e.evidence!==ev) return false;
        if (cost==="0" && e.money!=="0") return false;
        if (cost==="少" && e.money!=="少" && e.money!=="0") return false;
        const isDone=!!progress[e.id];
        if (done==="todo"&&isDone) return false;
        if (done==="done"&&!isDone) return false;
        if (onlyFav && !favs[e.id]) return false;
        if (!matchScene(e)) return false;
        if (!isRelevant(e)) return false;
        return true;
      }).sort((a,b)=>score(b)-score(a));
    }
    function renderStats(items) {
      const total=items.length, doneCount=items.filter(e=>progress[e.id]).length;
      const favCount=Object.keys(favs).length;
      const pct=total?Math.round(doneCount/total*100):0;
      statsEl.innerHTML=`
        <div class="stat-card"><div class="num">${total}</div><div class="label">${t("shown")}</div></div>
        <div class="stat-card"><div class="num">${doneCount}</div><div class="label">${t("completed")}</div></div>
        <div class="stat-card"><div class="num">${pct}%</div><div class="label">${t("rate")}</div></div>
        <div class="stat-card"><div class="num">${favCount}</div><div class="label">${t("fav")}</div></div>`;
    }
    function renderChapterStats() {
      if (!$("showChStats")||!$("showChStats").checked){ chapterStatsEl.classList.remove("show"); return; }
      const by={};
      ENTRIES.forEach(e=>{
        if (!by[e.chapter]) by[e.chapter]={total:0,done:0};
        by[e.chapter].total++;
        if (progress[e.id]) by[e.chapter].done++;
      });
      chapterStatsEl.innerHTML = `<h3>${t("chapterRate")}</h3>` + Object.entries(by).map(([name,v])=>{
        const pct=v.total?Math.round(v.done/v.total*100):0;
        return `<div class="ch-bar" data-ch="${name}"><span class="name" title="${disp(name)}">${disp(name)}</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="pct">${pct}%</span></div>`;
      }).join("");
      chapterStatsEl.classList.add("show");
      chapterStatsEl.querySelectorAll(".ch-bar").forEach(row=>{
        row.onclick=()=>{ $("filterChapter").value=row.dataset.ch; render(); };
      });
    }
    function render() {
      renderDaily();
      const items=getFiltered();
      renderStats(items);
      renderChapterStats();
      listEl.innerHTML = items.map(e=>{
        const done=!!progress[e.id], isFav=!!favs[e.id], isOpen=openIds.has(e.id);
        return `<article class="item ${done?"done":""} ${isFav?"fav":""} ${isOpen?"open":""}" data-id="${e.id}">
          <div class="item-top">
            <input type="checkbox" class="done-cb" data-id="${e.id}" ${done?"checked":""} />
            <div class="item-main">
              <div class="item-title-row">
                <div class="item-title toggle-open" data-id="${e.id}">${disp(e.title)}</div>
                <button class="star-btn ${isFav?"on":""}" data-id="${e.id}">★</button>
                <button class="chev toggle-open" data-id="${e.id}">▼</button>
              </div>
              <div class="item-meta">
                <span class="tag ${e.evidence.toLowerCase()}">${e.evidence}</span>
                <span class="tag ${e.money==="0"?"cost0":""}">${e.money==="0"?(lang==="en"?"Free":disp("不花")):disp(e.money)}</span>
                <span class="tag">${disp(e.chapter)}</span>
              </div>
              <div class="item-body">
                <p class="say">${disp(e.say)}</p>
                <p class="cost-benefit"><strong>${lang==="en"?"Cost":disp("成本")}：</strong>${disp(e.cost)}　<strong>${lang==="en"?"Benefit":disp("收益")}：</strong>${disp(e.benefit)}</p>
              </div>
            </div>
          </div>
        </article>`;
      }).join("") || `<p style="color:var(--muted);padding:16px">${t("noItems")}</p>`;

      listEl.querySelectorAll(".done-cb").forEach(cb=>{
        cb.onchange=()=>{
          const id=cb.dataset.id;
          if (cb.checked){ progress[id]=Date.now(); toast(t("doneYes")); }
          else delete progress[id];
          saveProgress(); render();
        };
      });
      listEl.querySelectorAll(".star-btn").forEach(btn=>{
        btn.onclick=e=>{
          e.stopPropagation();
          const id=btn.dataset.id;
          if (favs[id]) delete favs[id]; else favs[id]=Date.now();
          saveFavs(); render();
        };
      });
      listEl.querySelectorAll(".toggle-open").forEach(el=>{
        el.onclick=()=>{
          const id=el.dataset.id;
          if (openIds.has(id)) openIds.delete(id); else openIds.add(id);
          render();
        };
      });
    }

    $("scenarioBar").onclick = e => {
      const btn=e.target.closest(".scenario-btn"); if (!btn) return;
      $("scenarioBar").querySelectorAll(".scenario-btn").forEach(b=>b.classList.remove("active"));
      btn.classList.add("active");
      currentScene=btn.dataset.scene||"";
      render();
    };

    function doRandom(){
      const pool=ENTRIES.filter(e=>!progress[e.id]);
      if (!pool.length){ toast(t("allDone")); return; }
      tempDailyId=pool[Math.floor(Math.random()*pool.length)].id;
      renderDaily();
      dailyCardEl.scrollIntoView({behavior:"smooth",block:"nearest"});
      toast(t("challenge"));
    }

    $("search").oninput = render;
    $("filterChapter").onchange = render;
    $("filterEvidence").onchange = render;
    $("filterCost").onchange = render;
    $("filterDone").onchange = render;

    // bottom nav
    $("navSearch").onclick = () => { $("search").focus(); $("search").scrollIntoView({behavior:"smooth",block:"center"}); };
    $("navRandom").onclick = doRandom;
    $("navFav").onclick = () => {
      const cb=$("onlyFav"); if (cb){ cb.checked=!cb.checked; render(); }
    };
    $("navMenu").onclick = () => { menuPanel.classList.toggle("open"); };

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(()=>{}));
    }

    applyChrome();
    populateChapters();
  </script>
</body>
</html>
