<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高性價比人生指南 · 個人行動版</title>
  <meta name="description" content="基於《高性價比人生指南》的純前端個人進度追蹤與人生階段推薦工具。資料來源：eternity4719/HowToLiveBetter (CC BY 4.0)" />
  <meta name="theme-color" content="#0f1419" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    :root, [data-theme="dark"] {
      --bg: #0f1419;
      --card: #1a2332;
      --card-hover: #243044;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent2: #22c55e;
      --warn: #f59e0b;
      --radius: 12px;
      --daily-bg: linear-gradient(135deg, #1e3a5f 0%, #1a2332 100%);
    }
    [data-theme="light"] {
      --bg: #f4f6f9;
      --card: #ffffff;
      --card-hover: #f0f4f8;
      --border: #d1d9e6;
      --text: #1a2332;
      --muted: #64748b;
      --accent: #2563eb;
      --accent2: #16a34a;
      --warn: #d97706;
      --daily-bg: linear-gradient(135deg, #dbeafe 0%, #eff6ff 100%);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      transition: background 0.2s, color 0.2s;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
    header {
      padding: 20px 0 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 18px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }
    header h1 { font-size: 1.45rem; font-weight: 700; }
    header p { color: var(--muted); font-size: 0.88rem; margin-top: 4px; }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: var(--accent);
      color: #fff;
      margin-left: 6px;
      vertical-align: middle;
      opacity: 0.85;
    }
    .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

    #setup {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }
    #setup h2 { margin-bottom: 16px; font-size: 1.2rem; }
    .form-row { margin-bottom: 16px; }
    .form-row label { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
    select, input[type="text"], input[type="search"] {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 0.95rem;
    }
    select { max-width: 320px; width: 100%; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
    }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn {
      display: inline-block;
      padding: 10px 18px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.95rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-sm { padding: 6px 12px; font-size: 0.82rem; }
    .btn-ghost { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 0.85rem; }
    .btn-ghost:hover { color: var(--accent); }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      text-align: center;
    }
    .stat-card .num { font-size: 1.45rem; font-weight: 700; color: var(--accent2); }
    .stat-card .label { font-size: 0.75rem; color: var(--muted); }

    .chapter-stats {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-bottom: 16px;
      display: none;
    }
    .chapter-stats.show { display: block; }
    .chapter-stats h3 { font-size: 0.9rem; margin-bottom: 10px; color: var(--muted); }
    .ch-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
      font-size: 0.8rem;
    }
    .ch-bar .name { width: 140px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ch-bar .track {
      flex: 1;
      height: 8px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .ch-bar .fill {
      height: 100%;
      background: var(--accent2);
      border-radius: 4px;
      transition: width 0.3s;
    }
    .ch-bar .pct { width: 40px; text-align: right; color: var(--muted); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
      align-items: center;
    }
    .toolbar input[type="search"] {
      flex: 1;
      min-width: 180px;
    }
    .filters { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
    .filters select { width: auto; max-width: none; padding: 8px 10px; font-size: 0.85rem; }

    .toggle-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 14px;
      align-items: center;
    }
    .toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      color: var(--muted);
      cursor: pointer;
    }
    .toggle input { accent-color: var(--accent); width: 16px; height: 16px; }

    .scenario-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    .scenario-btn {
      padding: 6px 12px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 0.82rem;
      cursor: pointer;
    }
    .scenario-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .daily-card {
      background: var(--daily-bg);
      border: 1px solid var(--accent);
      border-radius: var(--radius);
      padding: 16px 18px;
      margin-bottom: 16px;
    }
    .daily-label { font-size: 0.72rem; color: var(--accent); letter-spacing: 0.04em; margin-bottom: 4px; font-weight: 600; }
    .daily-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
    .daily-say { color: var(--muted); font-size: 0.92rem; margin-bottom: 10px; }
    .daily-actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .daily-meta { font-size: 0.78rem; color: var(--muted); }

    .list { display: flex; flex-direction: column; gap: 10px; }
    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      transition: background 0.15s, border-color 0.15s;
    }
    .item:hover { background: var(--card-hover); }
    .item.done { opacity: 0.65; border-color: var(--accent2); }
    .item.fav { border-color: var(--warn); }
    .item-header { display: flex; gap: 10px; align-items: flex-start; }
    .item-header input[type="checkbox"] {
      width: 18px; height: 18px; margin-top: 3px; cursor: pointer; accent-color: var(--accent2);
    }
    .item-title { font-weight: 600; font-size: 1rem; flex: 1; }
    .star-btn {
      background: none; border: none; cursor: pointer; font-size: 1.2rem;
      color: var(--muted); padding: 0 4px; line-height: 1;
    }
    .star-btn.on { color: var(--warn); }
    .item-meta { display: flex; flex-wrap: wrap; gap: 5px; margin: 6px 0; }
    .tag {
      font-size: 0.72rem;
      padding: 2px 7px;
      border-radius: 5px;
      background: var(--border);
      color: var(--muted);
    }
    .tag.a { background: #14532d; color: #86efac; }
    .tag.b { background: #713f12; color: #fde68a; }
    .tag.c { background: #44403c; color: #d6d3d1; }
    [data-theme="light"] .tag.a { background: #dcfce7; color: #166534; }
    [data-theme="light"] .tag.b { background: #fef3c7; color: #92400e; }
    [data-theme="light"] .tag.c { background: #e7e5e4; color: #57534e; }
    .tag.cost0 { background: #164e63; color: #67e8f9; }
    [data-theme="light"] .tag.cost0 { background: #cffafe; color: #0e7490; }
    .say { color: var(--muted); font-size: 0.9rem; margin: 4px 0; }
    .cost-benefit { font-size: 0.82rem; color: var(--muted); }

    /* toast */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--accent2);
      color: #fff;
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.95rem;
      opacity: 0;
      transition: all 0.3s;
      z-index: 100;
      pointer-events: none;
    }
    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    footer {
      margin-top: 36px;
      padding: 18px 0;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
    footer a { color: var(--accent); }
    .hidden { display: none !important; }

    @media (max-width: 600px) {
      header h1 { font-size: 1.2rem; }
      .stats { grid-template-columns: 1fr 1fr; }
      .ch-bar .name { width: 100px; }
    }
  </style>
</head>
<body data-theme="dark">
  <div class="container">
    <header>
      <div>
        <h1>高性價比人生指南 <span class="badge">個人行動版</span></h1>
        <p>人生階段推薦 · 進度追蹤 · 收藏 · 每日推薦 · 純前端</p>
      </div>
      <div class="header-actions">
        <select id="langSel" style="width:auto;max-width:none;padding:6px 10px;font-size:0.82rem">
          <option value="zh-Hant">繁中</option>
          <option value="zh-Hans">简中</option>
          <option value="en">EN</option>
        </select>
        <button class="btn btn-secondary btn-sm" id="themeBtn" data-i18n="theme">亮色</button>
        <button class="btn btn-secondary btn-sm" id="loadFullBtn" data-i18n="loadFull">載入完整數據</button>
        <button class="btn btn-secondary btn-sm" id="exportBtn" data-i18n="export">匯出進度</button>
        <button class="btn btn-secondary btn-sm" id="importBtn" data-i18n="import">匯入進度</button>
        <input type="file" id="importFile" accept=".json" class="hidden" />
      </div>
    </header>

    <section id="setup">
      <h2>先設定你的情況</h2>
      <div class="form-row">
        <label>人生階段</label>
        <select id="stage">
          <option value="student">高中 / 大學生</option>
          <option value="early">剛工作（約 22–30 歲）</option>
          <option value="mid" selected>中年（約 30–50 歲）</option>
          <option value="senior">50 歲以上 / 退休前後</option>
        </select>
      </div>
      <div class="form-row">
        <label>個人情況（可多選）</label>
        <div class="chips" id="situations">
          <button type="button" class="chip" data-val="has_kids">有小孩</button>
          <button type="button" class="chip" data-val="pregnant">懷孕 / 備孕</button>
          <button type="button" class="chip" data-val="chronic">有慢性病</button>
          <button type="button" class="chip" data-val="unemployed">失業 / 求職中</button>
          <button type="button" class="chip" data-val="rent">租房</button>
          <button type="button" class="chip" data-val="own_house">已買房</button>
          <button type="button" class="chip" data-val="tech">做技術 / 程式相關</button>
        </div>
      </div>
      <button class="btn" id="startBtn">開始使用</button>
    </section>

    <section id="main" class="hidden">
      <div id="dailyCard" class="daily-card"></div>

      <div class="stats" id="stats"></div>
      <div class="chapter-stats" id="chapterStats"></div>

      <div class="scenario-bar" id="scenarioBar">
        <button class="scenario-btn active" data-scene="">全部</button>
        <button class="scenario-btn" data-scene="layoff">被裁之後</button>
        <button class="scenario-btn" data-scene="money">省錢理財</button>
        <button class="scenario-btn" data-scene="health">健康長壽</button>
        <button class="scenario-btn" data-scene="legal">法律風險</button>
        <button class="scenario-btn" data-scene="family">家庭育兒</button>
        <button class="scenario-btn" data-scene="career">工作技能</button>
      </div>

      <div class="toggle-row">
        <label class="toggle"><input type="checkbox" id="onlyMine" /> 只睇適合我</label>
        <label class="toggle"><input type="checkbox" id="onlyFav" /> 只睇收藏</label>
        <label class="toggle"><input type="checkbox" id="showChStats" /> 顯示章節完成率</label>
        <button class="btn btn-secondary btn-sm" id="randomBtn">隨機挑戰</button>
      </div>

      <div class="toolbar">
        <input type="search" id="search" placeholder="搜尋關鍵字…" />
        <div class="filters">
          <select id="filterChapter"><option value="">全部章節</option></select>
          <select id="filterEvidence">
            <option value="">全部證據</option>
            <option value="A">A 級</option>
            <option value="B">B 級</option>
            <option value="C">C 級</option>
          </select>
          <select id="filterCost">
            <option value="">全部成本</option>
            <option value="0">不花錢</option>
            <option value="少">少錢</option>
          </select>
          <select id="filterDone">
            <option value="">全部</option>
            <option value="todo">未完成</option>
            <option value="done">已完成</option>
          </select>
          <button class="btn btn-secondary btn-sm" id="resetProfile">重設個人資料</button>
        </div>
      </div>

      <div class="list" id="list"></div>
    </section>

    <footer>
      內容改編自 <a href="https://github.com/eternity4719/HowToLiveBetter" target="_blank" rel="noopener">eternity4719/HowToLiveBetter</a>
      《高性價比人生指南》（CC BY 4.0）。<br>
      本工具為非官方衍生作品，進度與收藏只存於你本機瀏覽器。<br>
      健康與法律建議請以醫生、律師及官方最新規定為準。
    </footer>
  </div>

  <div class="toast" id="toast"></div>

  <script>
const ENTRIES = [
      // ===== 01 不要早死 =====
      { id:"01-01", chapter:"01-不要早死", title:"戒煙，越早越好", say:"吸煙的人平均比不吸煙的人少活十年以上。40歲前戒掉，能把繼續吸煙帶來的死亡風險抹掉九成左右。", cost:"不花錢，反而省錢。難在戒斷期要熬。", benefit:"預期壽命多約10年（25–34歲戒）", evidence:"A", money:"0", time:"少", will:"是", stages:["early","mid","senior"], tags:[] },
      { id:"01-02", chapter:"01-不要早死", title:"別在家裡和車裡抽煙，也別讓客人抽", say:"全球每年約60萬人死於二手煙，其中近三成是孩子。", cost:"不花錢。難在要開口讓家人別抽。", benefit:"降低全家心血管與癌症風險", evidence:"A", money:"0", time:"少", will:"些", stages:["early","mid","senior"], tags:["has_kids"] },
      { id:"01-03", chapter:"01-不要早死", title:"注意燃氣安全（定期檢查、裝報警器）", say:"燃氣事故後果極嚴重，預防成本很低。", cost:"報警器與檢查費用不高。", benefit:"大幅降低致命風險", evidence:"A", money:"少", time:"少", will:"否", stages:["early","mid","senior"], tags:["own_house","rent"] },
      { id:"01-04", chapter:"01-不要早死", title:"不要採食野生蘑菇", say:"每年都有因野生蘑菇中毒死亡的案例，土辦法試毒不可靠。", cost:"不花錢。", benefit:"避免中毒死亡", evidence:"A", money:"0", time:"少", will:"否", stages:["early","mid","senior"], tags:[] },
      { id:"01-05", chapter:"01-不要早死", title:"上車系安全帶、騎車戴頭盔", say:"交通意外是年輕人重要死因，預防措施證據明確。", cost:"不花錢或買頭盔一次。", benefit:"大幅降低重傷與死亡風險", evidence:"A", money:"少", time:"少", will:"否", stages:["student","early","mid","senior"], tags:[] },

      // ===== 02 不要慢慢死 =====
      { id:"02-01", chapter:"02-不要慢慢死", title:"把家裡的食鹽換成低鈉鹽（鉀鹽）", say:"兩萬人隨機試驗：換成低鈉鹽的人五年內死亡概率低約12%，中風低約14%。", cost:"每袋貴幾元，買時順手換。", benefit:"總死亡率↓12%，中風↓14%", evidence:"A", money:"少", time:"少", will:"否", stages:["early","mid","senior"], tags:[] },
      { id:"02-02", chapter:"02-不要慢慢死", title:"每天吃一小把堅果（約28克）", say:"常吃堅果的人同期死亡概率比不吃的人低約兩成。", cost:"一年約兩三百元。", benefit:"總死亡率降低約20%", evidence:"A", money:"少", time:"少", will:"否", stages:["early","mid","senior"], tags:[] },
      { id:"02-03", chapter:"02-不要慢慢死", title:"每天走到7000–8000步", say:"走路是成本極低、證據很硬的長壽行為。", cost:"不花錢，需要時間。", benefit:"降低總死亡率與多種慢性病風險", evidence:"A", money:"0", time:"中", will:"些", stages:["early","mid","senior"], tags:[] },
      { id:"02-04", chapter:"02-不要慢慢死", title:"每晚睡大約7小時", say:"睡眠過少或過多都與更高死亡率相關。", cost:"不花錢，要改作息。", benefit:"精力與長期健康", evidence:"A", money:"0", time:"少", will:"些", stages:["student","early","mid","senior"], tags:[] },
      { id:"02-05", chapter:"02-不要慢慢死", title:"不喝含糖飲料", say:"含糖飲料與肥胖、糖尿病、心血管風險上升有關。", cost:"不花錢（改喝水）。", benefit:"降低代謝疾病風險", evidence:"A", money:"0", time:"少", will:"些", stages:["student","early","mid"], tags:[] },
      { id:"02-06", chapter:"02-不要慢慢死", title:"少吃加工肉（香腸、培根等）", say:"加工肉與大腸癌等風險上升有明確關聯。", cost:"不花錢。", benefit:"降低癌症風險", evidence:"A", money:"0", time:"少", will:"些", stages:["early","mid","senior"], tags:[] },
      { id:"02-07", chapter:"02-不要慢慢死", title:"精米白麵盡量換成全穀物", say:"全穀物與較低總死亡率相關。", cost:"價格略高一點。", benefit:"降低慢性病風險", evidence:"A", money:"少", time:"少", will:"些", stages:["early","mid","senior"], tags:[] },
      { id:"02-08", chapter:"02-不要慢慢死", title:"每周做力量訓練", say:"力量訓練對骨骼、肌肉與代謝都有好處。", cost:"可在家徒手或去健身房。", benefit:"降低死亡率、維持功能", evidence:"A", money:"少", time:"中", will:"是", stages:["early","mid","senior"], tags:[] },
      { id:"02-09", chapter:"02-不要慢慢死", title:"少喝或不喝酒", say:"即使少量飲酒，對健康的淨收益也越來越被質疑。", cost:"不花錢。", benefit:"降低多種疾病風險", evidence:"A", money:"0", time:"少", will:"些", stages:["early","mid","senior"], tags:[] },

      { id:"29-01", chapter:"29-遭遇重大打擊之後", title:"重大打擊後允許自己求助", say:"孤立會延長恢復時間。", cost:"開口求助的心理成本。", benefit:"加快心理與生活恢復", evidence:"B", money:"0", time:"中", will:"些", stages:["early","mid","senior"], tags:[] },
      { id:"30-01", chapter:"30-上學以後的孩子", title:"關注孩子睡眠與戶外活動時間", say:"睡眠不足與缺乏運動影響身心發展。", cost:"家庭作息調整。", benefit:"更好的成長基礎", evidence:"A", money:"0", time:"中", will:"些", stages:["mid"], tags:["has_kids"] },
      { id:"33-01", chapter:"33-殘疾之後怎麼活", title:"了解殘疾人證與相關福利政策", say:"符合條件時應申請，這是法定權益。", cost:"辦理時間。", benefit:"獲得應有支持", evidence:"A", money:"0", time:"中", will:"否", stages:["early","mid","senior"], tags:[] }
    ];

    // 場景關鍵字對應
    const SCENES = {
      layoff: ["失業", "被裁", "離職", "工傷", "仲裁", "補償", "N"],
      money: ["錢", "續費", "套餐", "彩票", "基金", "保險", "信用卡", "公積金", "稅", "投資", "虛擬貨幣", "打賞"],
      health: ["戒煙", "鹽", "堅果", "睡眠", "步", "運動", "酒", "糖", "肉", "穀", "BMI", "牙", "疫苗", "急救"],
      legal: ["擔保", "法律", "轉發", "刷流水", "拋物", "合同", "產權", "合規"],
      family: ["孩子", "嬰兒", "懷孕", "葉酸", "仰睡", "老人", "跌倒", "養"],
      career: ["技能", "證書", "通勤", "會議", "私活", "平台", "夜班", "專注"]
    };

    const STORAGE_KEY = "htlb_progress_v1";
    const FAV_KEY = "htlb_fav_v1";
    const PROFILE_KEY = "htlb_profile_v1";
    const THEME_KEY = "htlb_theme_v1";

    let profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null");
    let progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
    let favs = JSON.parse(localStorage.getItem(FAV_KEY) || "{}");
    let currentScene = "";
    let tempDailyId = null;

    const setupEl = document.getElementById("setup");
    const mainEl = document.getElementById("main");
    const stageSel = document.getElementById("stage");
    const situationsEl = document.getElementById("situations");
    const startBtn = document.getElementById("startBtn");
    const listEl = document.getElementById("list");
    const statsEl = document.getElementById("stats");
    const chapterStatsEl = document.getElementById("chapterStats");
    const searchEl = document.getElementById("search");
    const filterChapter = document.getElementById("filterChapter");
    const filterEvidence = document.getElementById("filterEvidence");
    const filterCost = document.getElementById("filterCost");
    const filterDone = document.getElementById("filterDone");
    const resetBtn = document.getElementById("resetProfile");
    const dailyCardEl = document.getElementById("dailyCard");
    const onlyMine = document.getElementById("onlyMine");
    const onlyFav = document.getElementById("onlyFav");
    const showChStats = document.getElementById("showChStats");
    const randomBtn = document.getElementById("randomBtn");
    const themeBtn = document.getElementById("themeBtn");
    const exportBtn = document.getElementById("exportBtn");
    const importBtn = document.getElementById("importBtn");
    const importFile = document.getElementById("importFile");
    const toastEl = document.getElementById("toast");

    // theme
    const savedTheme = localStorage.getItem(THEME_KEY) || "dark";
    document.body.setAttribute("data-theme", savedTheme);
    themeBtn.textContent = savedTheme === "dark" ? "亮色" : "暗色";
    themeBtn.addEventListener("click", () => {
      const next = document.body.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.body.setAttribute("data-theme", next);
      localStorage.setItem(THEME_KEY, next);
      themeBtn.textContent = next === "dark" ? "亮色" : "暗色";
    });

    function toast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 1800);
    }

    situationsEl.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => chip.classList.toggle("active"));
    });

    function getSelectedSituations() {
      return [...situationsEl.querySelectorAll(".chip.active")].map(c => c.dataset.val);
    }

    startBtn.addEventListener("click", () => {
      profile = { stage: stageSel.value, situations: getSelectedSituations() };
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      showMain();
    });

    resetBtn.addEventListener("click", () => {
      if (confirm("確定重設個人資料？（進度與收藏會保留）")) {
        localStorage.removeItem(PROFILE_KEY);
        profile = null;
        setupEl.classList.remove("hidden");
        mainEl.classList.add("hidden");
      }
    });

    function showMain() {
      setupEl.classList.add("hidden");
      mainEl.classList.remove("hidden");
      populateChapters();
      render();
    }

    if (profile) {
      stageSel.value = profile.stage || "mid";
      (profile.situations || []).forEach(s => {
        const chip = situationsEl.querySelector(`[data-val="${s}"]`);
        if (chip) chip.classList.add("active");
      });
      showMain();
    }

    function saveProgress() { localStorage.setItem(STORAGE_KEY, JSON.stringify(progress)); }
    function saveFavs() { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }

    // export / import
    exportBtn.addEventListener("click", () => {
      const data = {
        version: 1,
        exportedAt: new Date().toISOString(),
        profile,
        progress,
        favs
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `howtolivebetter-progress-${new Date().toISOString().slice(0,10)}.json`;
      a.click();
      toast("已匯出進度");
    });
    importBtn.addEventListener("click", () => importFile.click());
    importFile.addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.progress) progress = data.progress;
          if (data.favs) favs = data.favs;
          if (data.profile) {
            profile = data.profile;
            localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
          }
          saveProgress();
          saveFavs();
          toast("已匯入進度");
          if (profile) showMain();
          else render();
        } catch {
          alert("匯入失敗，請確認係正確的 JSON 檔");
        }
      };
      reader.readAsText(file);
      importFile.value = "";
    });

    function isRelevant(entry) {
      if (!profile) return true;
      if (!onlyMine.checked) return true;
      const stageOk = !entry.stages || !entry.stages.length || entry.stages.includes(profile.stage);
      if (!stageOk) return false;
      if (entry.tags && entry.tags.length) {
        const sit = profile.situations || [];
        // 有 tags 的條目：若用戶有任一對應情況則顯示；若用戶完全無相關情況仍顯示通用條目（tags 空的）
        // 這裡：有 tags 時，至少要有一個匹配才算「適合我」；無 tags 則視為通用適合
        return entry.tags.some(t => sit.includes(t));
      }
      return true; // 無 tags = 通用
    }

    function score(entry) {
      let s = 0;
      if (profile && entry.stages && entry.stages.includes(profile.stage)) s += 10;
      if (profile && entry.tags) {
        entry.tags.forEach(t => {
          if ((profile.situations || []).includes(t)) s += 20;
        });
      }
      if (entry.evidence === "A") s += 5;
      if (entry.money === "0") s += 3;
      if (favs[entry.id]) s += 15;
      return s;
    }

    function populateChapters() {
      const chapters = [...new Set(ENTRIES.map(e => e.chapter))].sort();
      filterChapter.innerHTML = '<option value="">全部章節</option>' +
        chapters.map(c => `<option value="${c}">${c}</option>`).join("");
    }

    function getDailyEntry() {
      const today = new Date().toISOString().slice(0, 10);
      const seed = today.split("-").reduce((a, b) => a + parseInt(b, 10), 0);
      if (tempDailyId) {
        const found = ENTRIES.find(e => e.id === tempDailyId);
        if (found) return found;
      }
      const candidates = ENTRIES
        .filter(e => !progress[e.id])
        .sort((a, b) => {
          const sa = (a.evidence === "A" ? 10 : 0) + (a.money === "0" ? 5 : 0) + score(a);
          const sb = (b.evidence === "A" ? 10 : 0) + (b.money === "0" ? 5 : 0) + score(b);
          return sb - sa;
        });
      if (!candidates.length) return ENTRIES[seed % ENTRIES.length];
      return candidates[seed % candidates.length];
    }

    function renderDaily() {
      const e = getDailyEntry();
      if (!e) { dailyCardEl.innerHTML = ""; return; }
      const done = !!progress[e.id];
      dailyCardEl.innerHTML = `
        <div class="daily-label">今日推薦 · ${new Date().toLocaleDateString("zh-HK")}</div>
        <div class="daily-title">${e.title}</div>
        <p class="daily-say">${e.say}</p>
        <div class="daily-actions">
          <button class="btn btn-sm" id="dailyDoneBtn">${done ? "已完成 ✓" : "標記完成"}</button>
          <button class="btn btn-secondary btn-sm" id="dailyAnotherBtn">換一條</button>
          <span class="daily-meta">證據 ${e.evidence} · 錢：${e.money === "0" ? "不花" : e.money} · ${e.chapter}</span>
        </div>
      `;
      document.getElementById("dailyDoneBtn").onclick = () => {
        if (progress[e.id]) delete progress[e.id];
        else { progress[e.id] = Date.now(); toast("已完成 ✓"); }
        saveProgress();
        tempDailyId = null;
        render();
      };
      document.getElementById("dailyAnotherBtn").onclick = () => {
        const others = ENTRIES.filter(x => x.id !== e.id && !progress[x.id]);
        const pick = others[Math.floor(Math.random() * others.length)] || e;
        tempDailyId = pick.id;
        renderDaily();
      };
    }

    function matchScene(entry) {
      if (!currentScene) return true;
      const keys = SCENES[currentScene] || [];
      const text = entry.title + entry.say + entry.chapter;
      return keys.some(k => text.includes(k));
    }

    function getFiltered() {
      const q = (searchEl.value || "").trim().toLowerCase();
      const ch = filterChapter.value;
      const ev = filterEvidence.value;
      const cost = filterCost.value;
      const done = filterDone.value;

      return ENTRIES
        .filter(e => {
          if (q && !(e.title + e.say + e.chapter).toLowerCase().includes(q)) return false;
          if (ch && e.chapter !== ch) return false;
          if (ev && e.evidence !== ev) return false;
          if (cost === "0" && e.money !== "0") return false;
          if (cost === "少" && e.money !== "少" && e.money !== "0") return false;
          const isDone = !!progress[e.id];
          if (done === "todo" && isDone) return false;
          if (done === "done" && !isDone) return false;
          if (onlyFav.checked && !favs[e.id]) return false;
          if (!matchScene(e)) return false;
          if (!isRelevant(e)) return false;
          return true;
        })
        .sort((a, b) => score(b) - score(a));
    }

    function renderStats(items) {
      const total = items.length;
      const doneCount = items.filter(e => progress[e.id]).length;
      const favCount = Object.keys(favs).length;
      const pct = total ? Math.round((doneCount / total) * 100) : 0;
      statsEl.innerHTML = `
        <div class="stat-card"><div class="num">${total}</div><div class="label">目前顯示</div></div>
        <div class="stat-card"><div class="num">${doneCount}</div><div class="label">已完成</div></div>
        <div class="stat-card"><div class="num">${pct}%</div><div class="label">完成率</div></div>
        <div class="stat-card"><div class="num">${favCount}</div><div class="label">收藏</div></div>
      `;
    }

    function renderChapterStats() {
      if (!showChStats.checked) {
        chapterStatsEl.classList.remove("show");
        return;
      }
      const byCh = {};
      ENTRIES.forEach(e => {
        if (!byCh[e.chapter]) byCh[e.chapter] = { total: 0, done: 0 };
        byCh[e.chapter].total++;
        if (progress[e.id]) byCh[e.chapter].done++;
      });
      const rows = Object.entries(byCh)
        .map(([name, v]) => {
          const pct = v.total ? Math.round(v.done / v.total * 100) : 0;
          return `<div class="ch-bar"><span class="name" title="${name}">${name}</span><div class="track"><div class="fill" style="width:${pct}%"></div></div><span class="pct">${pct}%</span></div>`;
        })
        .join("");
      chapterStatsEl.innerHTML = `<h3>各章節完成率</h3>${rows}`;
      chapterStatsEl.classList.add("show");
    }

    function render() {
      renderDaily();
      const items = getFiltered();
      renderStats(items);
      renderChapterStats();
      listEl.innerHTML = items.map(e => {
        const done = !!progress[e.id];
        const isFav = !!favs[e.id];
        return `
          <article class="item ${done ? "done" : ""} ${isFav ? "fav" : ""}" data-id="${e.id}">
            <div class="item-header">
              <input type="checkbox" ${done ? "checked" : ""} data-id="${e.id}" class="done-cb" />
              <div style="flex:1">
                <div style="display:flex;align-items:flex-start;gap:6px">
                  <div class="item-title">${e.title}</div>
                  <button class="star-btn ${isFav ? "on" : ""}" data-id="${e.id}" title="收藏">★</button>
                </div>
                <div class="item-meta">
                  <span class="tag ${e.evidence.toLowerCase()}">證據 ${e.evidence}</span>
                  <span class="tag ${e.money === "0" ? "cost0" : ""}">錢：${e.money === "0" ? "不花" : e.money}</span>
                  <span class="tag">時間：${e.time}</span>
                  <span class="tag">毅力：${e.will}</span>
                  <span class="tag">${e.chapter}</span>
                </div>
                <p class="say">${e.say}</p>
                <p class="cost-benefit"><strong>成本：</strong>${e.cost}　<strong>收益：</strong>${e.benefit}</p>
              </div>
            </div>
          </article>
        `;
      }).join("") || `<p style="color:var(--muted);padding:20px;">沒有符合條件的條目</p>`;

      listEl.querySelectorAll(".done-cb").forEach(cb => {
        cb.addEventListener("change", () => {
          const id = cb.dataset.id;
          if (cb.checked) {
            progress[id] = Date.now();
            toast("已完成 ✓");
          } else delete progress[id];
          saveProgress();
          render();
        });
      });
      listEl.querySelectorAll(".star-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          const id = btn.dataset.id;
          if (favs[id]) delete favs[id];
          else favs[id] = Date.now();
          saveFavs();
          render();
        });
      });
    }

    // scenario buttons
    document.getElementById("scenarioBar").addEventListener("click", (e) => {
      const btn = e.target.closest(".scenario-btn");
      if (!btn) return;
      document.querySelectorAll(".scenario-btn").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentScene = btn.dataset.scene || "";
      render();
    });

    randomBtn.addEventListener("click", () => {
      const pool = ENTRIES.filter(e => !progress[e.id]);
      if (!pool.length) { toast("全部完成啦！"); return; }
      const pick = pool[Math.floor(Math.random() * pool.length)];
      tempDailyId = pick.id;
      renderDaily();
      dailyCardEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
      toast("已抽一條挑戰");
    });

    searchEl.addEventListener("input", render);
    filterChapter.addEventListener("change", render);
    filterEvidence.addEventListener("change", render);
    filterCost.addEventListener("change", render);
    filterDone.addEventListener("change", render);
    onlyMine.addEventListener("change", render);
    onlyFav.addEventListener("change", render);
    showChStats.addEventListener("change", render);


    // ===== 11. i18n =====
    const I18N = {
      "zh-Hant": {
        theme: "亮色", themeDark: "暗色", export: "匯出進度", import: "匯入進度",
        loadFull: "載入完整數據", loading: "載入中…", loadOk: "已載入完整數據",
        loadFail: "載入失敗，請稍後再試", onlyMine: "只睇適合我", onlyFav: "只睇收藏",
        showCh: "顯示章節完成率", random: "隨機挑戰", reset: "重設個人資料",
        start: "開始使用", setupTitle: "先設定你的情況", stageLabel: "人生階段",
        sitLabel: "個人情況（可多選）", dailyLabel: "今日推薦", done: "標記完成",
        doneYes: "已完成 ✓", swap: "換一條", searchPh: "搜尋關鍵字…",
        allCh: "全部章節", allEv: "全部證據", allCost: "全部成本", noMoney: "不花錢",
        littleMoney: "少錢", all: "全部", todo: "未完成", doneFilter: "已完成",
        fav: "收藏", shown: "目前顯示", completed: "已完成", rate: "完成率",
        chapterRate: "各章節完成率", noItems: "沒有符合條件的條目",
        exported: "已匯出進度", imported: "已匯入進度", challenge: "已抽一條挑戰",
        allDone: "全部完成啦！", scenes: {"":"全部","layoff":"被裁之後","money":"省錢理財","health":"健康長壽","legal":"法律風險","family":"家庭育兒","career":"工作技能"}
      },
      "zh-Hans": {
        theme: "亮色", themeDark: "暗色", export: "导出进度", import: "导入进度",
        loadFull: "加载完整数据", loading: "加载中…", loadOk: "已加载完整数据",
        loadFail: "加载失败，请稍后再试", onlyMine: "只看适合我", onlyFav: "只看收藏",
        showCh: "显示章节完成率", random: "随机挑战", reset: "重设个人资料",
        start: "开始使用", setupTitle: "先设定你的情况", stageLabel: "人生阶段",
        sitLabel: "个人情况（可多选）", dailyLabel: "今日推荐", done: "标记完成",
        doneYes: "已完成 ✓", swap: "换一条", searchPh: "搜索关键词…",
        allCh: "全部章节", allEv: "全部证据", allCost: "全部成本", noMoney: "不花钱",
        littleMoney: "少钱", all: "全部", todo: "未完成", doneFilter: "已完成",
        fav: "收藏", shown: "目前显示", completed: "已完成", rate: "完成率",
        chapterRate: "各章节完成率", noItems: "没有符合条件的条目",
        exported: "已导出进度", imported: "已导入进度", challenge: "已抽一条挑战",
        allDone: "全部完成啦！", scenes: {"":"全部","layoff":"被裁之后","money":"省钱理财","health":"健康长寿","legal":"法律风险","family":"家庭育儿","career":"工作技能"}
      },
      en: {
        theme: "Light", themeDark: "Dark", export: "Export", import: "Import",
        loadFull: "Load full dataset", loading: "Loading…", loadOk: "Full dataset loaded",
        loadFail: "Load failed, try again later", onlyMine: "Only for me", onlyFav: "Favorites only",
        showCh: "Chapter progress", random: "Random challenge", reset: "Reset profile",
        start: "Start", setupTitle: "Set your profile", stageLabel: "Life stage",
        sitLabel: "Situation (multi-select)", dailyLabel: "Today's pick", done: "Mark done",
        doneYes: "Done ✓", swap: "Another", searchPh: "Search…",
        allCh: "All chapters", allEv: "All evidence", allCost: "All costs", noMoney: "Free",
        littleMoney: "Cheap", all: "All", todo: "Todo", doneFilter: "Done",
        fav: "Favorites", shown: "Shown", completed: "Done", rate: "Rate",
        chapterRate: "Progress by chapter", noItems: "No matching items",
        exported: "Exported", imported: "Imported", challenge: "New challenge",
        allDone: "All done!", scenes: {"":"All","layoff":"After layoff","money":"Save money","health":"Health","legal":"Legal risks","family":"Family","career":"Career"}
      }
    };
    let lang = localStorage.getItem("htlb_lang_v1") || "zh-Hant";
    const langSel = document.getElementById("langSel");
    if (langSel) langSel.value = lang;

    function t(key) {
      const pack = I18N[lang] || I18N["zh-Hant"];
      return pack[key] != null ? pack[key] : key;
    }
    function applyI18n() {
      document.querySelectorAll("[data-i18n]").forEach(el => {
        const k = el.getAttribute("data-i18n");
        if (k === "theme") {
          const isDark = document.body.getAttribute("data-theme") === "dark";
          el.textContent = isDark ? t("theme") : t("themeDark");
        } else {
          el.textContent = t(k);
        }
      });
      const search = document.getElementById("search");
      if (search) search.placeholder = t("searchPh");
      // scenario buttons
      document.querySelectorAll(".scenario-btn").forEach(btn => {
        const sc = btn.dataset.scene || "";
        const scenes = (I18N[lang] || I18N["zh-Hant"]).scenes || {};
        if (scenes[sc] != null) btn.textContent = scenes[sc];
      });
      const startBtnEl = document.getElementById("startBtn");
      if (startBtnEl) startBtnEl.textContent = t("start");
      const resetBtnEl = document.getElementById("resetProfile");
      if (resetBtnEl) resetBtnEl.textContent = t("reset");
      // redo toggles cleanly with current i18n labels
      const row = document.querySelector(".toggle-row");
      if (row) {
        const onlyMineCb = document.getElementById("onlyMine");
        const onlyFavCb = document.getElementById("onlyFav");
        const showChCb = document.getElementById("showChStats");
        const om = onlyMineCb ? onlyMineCb.checked : false;
        const of = onlyFavCb ? onlyFavCb.checked : false;
        const sc = showChCb ? showChCb.checked : false;
        row.innerHTML = `
          <label class="toggle"><input type="checkbox" id="onlyMine" ${om?"checked":""}/> ${t("onlyMine")}</label>
          <label class="toggle"><input type="checkbox" id="onlyFav" ${of?"checked":""}/> ${t("onlyFav")}</label>
          <label class="toggle"><input type="checkbox" id="showChStats" ${sc?"checked":""}/> ${t("showCh")}</label>
          <button class="btn btn-secondary btn-sm" id="randomBtn">${t("random")}</button>
        `;
        document.getElementById("onlyMine").addEventListener("change", render);
        document.getElementById("onlyFav").addEventListener("change", render);
        document.getElementById("showChStats").addEventListener("change", render);
        document.getElementById("randomBtn").addEventListener("click", () => {
          const pool = ENTRIES.filter(e => !progress[e.id]);
          if (!pool.length) { toast(t("allDone")); return; }
          const pick = pool[Math.floor(Math.random() * pool.length)];
          tempDailyId = pick.id;
          renderDaily();
          dailyCardEl.scrollIntoView({ behavior: "smooth", block: "nearest" });
          toast(t("challenge"));
        });
      }
      // filter option texts
      const fe = document.getElementById("filterEvidence");
      if (fe) {
        fe.options[0].text = t("allEv");
      }
      const fc = document.getElementById("filterCost");
      if (fc) {
        fc.options[0].text = t("allCost");
        if (fc.options[1]) fc.options[1].text = t("noMoney");
        if (fc.options[2]) fc.options[2].text = t("littleMoney");
      }
      const fd = document.getElementById("filterDone");
      if (fd) {
        fd.options[0].text = t("all");
        if (fd.options[1]) fd.options[1].text = t("todo");
        if (fd.options[2]) fd.options[2].text = t("doneFilter");
      }
      render();
    }
    if (langSel) {
      langSel.addEventListener("change", () => {
        lang = langSel.value;
        localStorage.setItem("htlb_lang_v1", lang);
        applyI18n();
      });
    }

    // ===== 9. Load full dataset from htlb-dataset =====
    const FULL_URL = "https://cdn.jsdelivr.net/gh/sin0317/htlb-dataset@main/data/htlb.json";
    const FULL_URL_FALLBACK = "https://raw.githubusercontent.com/sin0317/htlb-dataset/main/data/htlb.json";
    let ENTRIES_BASE = ENTRIES.slice();

    function mapDatasetItem(it) {
      const sec = it.section_title || ("第" + it.section + "节");
      const chapter = String(it.section).padStart(2, "0") + "-" + sec;
      return {
        id: String(it.id),
        chapter: chapter,
        title: it.title || "",
        say: it.plain || "",
        cost: it.cost_text || "",
        benefit: it.benefit_text || (it.benefit_level || ""),
        evidence: (it.evidence || "C").charAt(0).toUpperCase(),
        money: it.cost_money === "0" || it.cost_money === 0 ? "0" : (it.cost_money || "少"),
        time: it.cost_time || "少",
        will: it.cost_willpower || "否",
        stages: ["student","early","mid","senior"],
        tags: []
      };
    }

    async function loadFullDataset() {
      const btn = document.getElementById("loadFullBtn");
      if (btn) { btn.disabled = true; btn.textContent = t("loading"); }
      try {
        let res = await fetch(FULL_URL);
        if (!res.ok) res = await fetch(FULL_URL_FALLBACK);
        if (!res.ok) throw new Error("http " + res.status);
        const data = await res.json();
        const items = data.items || data;
        if (!Array.isArray(items) || !items.length) throw new Error("empty");
        ENTRIES.length = 0;
        items.forEach(it => ENTRIES.push(mapDatasetItem(it)));
        populateChapters();
        tempDailyId = null;
        render();
        toast(t("loadOk") + " (" + ENTRIES.length + ")");
        try { localStorage.setItem("htlb_full_loaded_v1", "1"); } catch(e) {}
      } catch (err) {
        console.error(err);
        toast(t("loadFail"));
      } finally {
        if (btn) { btn.disabled = false; btn.textContent = t("loadFull"); }
      }
    }
    const loadFullBtn = document.getElementById("loadFullBtn");
    if (loadFullBtn) loadFullBtn.addEventListener("click", loadFullDataset);

    // ===== 10. PWA service worker =====
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }

    // patch toast/export messages to use i18n when possible
    const _toast = toast;
    // leave as is; applyI18n will refresh labels

    applyI18n();

    populateChapters();
  </script>
