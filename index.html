<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>高性價比人生指南 · 個人行動版</title>
  <meta name="description" content="基於《高性價比人生指南》的純前端個人進度追蹤與人生階段推薦工具。資料來源：eternity4719/HowToLiveBetter (CC BY 4.0)" />
  <style>
    :root {
      --bg: #0f1419;
      --card: #1a2332;
      --card-hover: #243044;
      --border: #2d3a4f;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3b82f6;
      --accent2: #22c55e;
      --warn: #f59e0b;
      --danger: #ef4444;
      --radius: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
    header {
      padding: 24px 0 16px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 20px;
    }
    header h1 { font-size: 1.5rem; font-weight: 700; }
    header p { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
    .badge {
      display: inline-block;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 999px;
      background: #1e3a5f;
      color: #93c5fd;
      margin-left: 8px;
      vertical-align: middle;
    }

    /* Profile setup */
    #setup {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 24px;
    }
    #setup h2 { margin-bottom: 16px; font-size: 1.2rem; }
    .form-row { margin-bottom: 16px; }
    .form-row label { display: block; color: var(--muted); font-size: 0.85rem; margin-bottom: 6px; }
    select, input[type="text"] {
      width: 100%;
      max-width: 320px;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font-size: 1rem;
    }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text);
      cursor: pointer;
      font-size: 0.9rem;
      transition: all 0.15s;
    }
    .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn {
      display: inline-block;
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 1rem;
      cursor: pointer;
      font-weight: 600;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-sm { padding: 6px 12px; font-size: 0.85rem; }

    /* Stats bar */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }
    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      text-align: center;
    }
    .stat-card .num { font-size: 1.6rem; font-weight: 700; color: var(--accent2); }
    .stat-card .label { font-size: 0.8rem; color: var(--muted); }

    /* Toolbar */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      align-items: center;
    }
    .toolbar input[type="search"] {
      flex: 1;
      min-width: 200px;
      padding: 10px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
    }
    .filters { display: flex; flex-wrap: wrap; gap: 8px; }

    /* Cards */
    .list { display: flex; flex-direction: column; gap: 12px; }
    .item {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      transition: background 0.15s;
    }
    .item:hover { background: var(--card-hover); }
    .item.done { opacity: 0.7; border-color: #166534; }
    .item-header {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }
    .item-header input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin-top: 3px;
      cursor: pointer;
      accent-color: var(--accent2);
    }
    .item-title { font-weight: 600; font-size: 1.05rem; flex: 1; }
    .item-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 8px 0;
    }
    .tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 6px;
      background: #1e293b;
      color: var(--muted);
    }
    .tag.a { background: #14532d; color: #86efac; }
    .tag.b { background: #713f12; color: #fde68a; }
    .tag.c { background: #44403c; color: #d6d3d1; }
    .tag.cost0 { background: #164e63; color: #67e8f9; }
    .say { color: var(--muted); font-size: 0.95rem; margin: 6px 0; }
    .cost-benefit { font-size: 0.85rem; color: #94a3b8; }
    .item-footer { margin-top: 10px; font-size: 0.8rem; color: var(--muted); }

    /* 每日推薦 */
    .daily-card {
      background: linear-gradient(135deg, #1e3a5f 0%, #1a2332 100%);
      border: 1px solid #3b82f6;
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 20px;
      position: relative;
    }
    .daily-card .daily-label {
      font-size: 0.75rem;
      color: #93c5fd;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 6px;
    }
    .daily-card .daily-title {
      font-size: 1.15rem;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .daily-card .daily-say {
      color: var(--muted);
      font-size: 0.95rem;
      margin-bottom: 10px;
    }
    .daily-card .daily-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .daily-card .daily-meta {
      font-size: 0.8rem;
      color: #94a3b8;
    }

    footer {
      margin-top: 40px;
      padding: 20px 0;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
    }
    footer a { color: #93c5fd; }

    .hidden { display: none !important; }
    @media (max-width: 600px) {
      header h1 { font-size: 1.25rem; }
      .stats { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>高性價比人生指南 <span class="badge">個人行動版</span></h1>
      <p>按人生階段推薦 · 進度追蹤 · 純前端 · 資料存於本機瀏覽器</p>
    </header>

    <!-- 初次設定 -->
    <section id="setup">
      <h2>先設定你的情況</h2>
      <div class="form-row">
        <label>人生階段</label>
        <select id="stage">
          <option value="student">高中 / 大學生</option>
          <option value="early">剛工作（約 22–30 歲）</option>
          <option value="mid" selected>中年（約 30–50 歲）</option>
          <option value="senior">50 歲以上 / 退休前後</option>
        </select>
      </div>
      <div class="form-row">
        <label>個人情況（可多選）</label>
        <div class="chips" id="situations">
          <button type="button" class="chip" data-val="has_kids">有小孩</button>
          <button type="button" class="chip" data-val="pregnant">懷孕 / 備孕</button>
          <button type="button" class="chip" data-val="chronic">有慢性病</button>
          <button type="button" class="chip" data-val="unemployed">失業 / 求職中</button>
          <button type="button" class="chip" data-val="rent">租房</button>
          <button type="button" class="chip" data-val="own_house">已買房</button>
          <button type="button" class="chip" data-val="tech">做技術 / 程式相關</button>
        </div>
      </div>
      <button class="btn" id="startBtn">開始使用</button>
    </section>

    <!-- 主介面 -->
    <section id="main" class="hidden">
      <!-- 每日推薦 -->
      <div id="dailyCard" class="daily-card"></div>

      <div class="stats" id="stats"></div>

      <div class="toolbar">
        <input type="search" id="search" placeholder="搜尋關鍵字（例如：鹽、睡眠、失業…）" />
        <div class="filters">
          <select id="filterChapter">
            <option value="">全部章節</option>
          </select>
          <select id="filterEvidence">
            <option value="">全部證據</option>
            <option value="A">A 級</option>
            <option value="B">B 級</option>
            <option value="C">C 級</option>
          </select>
          <select id="filterCost">
            <option value="">全部成本</option>
            <option value="0">不花錢</option>
            <option value="少">少錢</option>
          </select>
          <select id="filterDone">
            <option value="">全部</option>
            <option value="todo">未完成</option>
            <option value="done">已完成</option>
          </select>
          <button class="btn btn-secondary btn-sm" id="resetProfile">重設個人資料</button>
        </div>
      </div>

      <div class="list" id="list"></div>
    </section>


    <footer>
      內容改編自 <a href="https://github.com/eternity4719/HowToLiveBetter" target="_blank" rel="noopener">eternity4719/HowToLiveBetter</a>
      《高性價比人生指南》（CC BY 4.0）。<br>
      本工具為非官方衍生作品，進度資料只存於你本機瀏覽器，不會上傳。<br>
      健康與法律建議請以醫生、律師及官方最新規定為準。
    </footer>
  </div>

      { id:"05-17", chapter:"05-不要浪費錢", title:"個人養老金帳戶可考慮（視自身情況）", say:"有稅收優惠，但是否適合要看個人稅率與流動性需求。", cost:"學習與開戶。", benefit:"可能的稅優與長期儲蓄", evidence:"B", money:"0", time:"中", will:"些", stages:["early","mid"], tags:[] },
      { id:"07-03", chapter:"07-沒錢的時候怎麼活", title:"了解低保、救助站等社會救助渠道", say:"符合條件時應主動申請，這是權利不是施捨。", cost:"諮詢與申請時間。", benefit:"基本生活保障", evidence:"A", money:"0", time:"中", will:"否", stages:["early","mid","senior"], tags:["unemployed"] },
      { id:"08-05", chapter:"08-別把自己搭進去", title:"交通事故後依法處理，保留證據", say:"保留證據、報警與保險流程很重要。", cost:"時間與程序。", benefit:"保護自身權益", evidence:"A", money:"0", time:"中", will:"否", stages:["early","mid","senior"], tags:[] },
      { id:"09-03", chapter:"09-普通人容易踩的法律紅線", title:"高空拋物可能承擔刑事責任", say:"即使沒造成重傷，也可能構成犯罪。", cost:"不拋即可。", benefit:"避免刑事風險", evidence:"A", money:"0", time:"少", will:"否", stages:["student","early","mid","senior"], tags:[] },
      { id:"13-03", chapter:"13-緊急情況", title:"學海姆立克急救法（噎住時）", say:"噎住是可預防的急症，方法簡單有效。", cost:"學一次即可。", benefit:"關鍵時刻可救命", evidence:"A", money:"0", time:"少", will:"否", stages:["early","mid","senior"], tags:["has_kids"] },
      { id:"15-03", chapter:"15-租房與買房", title:"租房合同看清提前解約與押金退還條款", say:"很多糾紛出在合同細節。", cost:"簽約前多讀幾遍。", benefit:"降低押金與違約損失", evidence:"B", money:"0", time:"少", will:"否", stages:["student","early","mid"], tags:["rent"] },
      { id:"19-03", chapter:"19-在職離職和工傷", title:"工傷認定有時限，受傷後盡快報", say:"超過時限可能影響認定與賠償。", cost:"及時行動。", benefit:"保障工傷待遇", evidence:"A", money:"0", time:"少", will:"否", stages:["early","mid"], tags:[] },
      { id:"20-03", chapter:"20-剛出生的孩子怎麼帶", title:"嬰兒床保持簡單，勿放過多物品", say:"減少窒息與猝死相關風險。", cost:"不花錢。", benefit:"更安全的睡眠環境", evidence:"A", money:"0", time:"少", will:"否", stages:["early","mid"], tags:["has_kids","pregnant"] },
      { id:"22-01", chapter:"22-怎麼放鬆", title:"用可驗證有效的方式放鬆（運動、社交、睡眠）", say:"真正恢復精力的方式往往成本低。", cost:"習慣調整。", benefit:"更好的精力恢復", evidence:"B", money:"0", time:"中", will:"些", stages:["early","mid"], tags:[] },
      { id:"23-02", chapter:"23-學什麼技能划算", title:"證書要能在官方渠道查驗", say:"無法查驗的證書價值存疑。", cost:"報名前查清楚。", benefit:"避免無效投入", evidence:"B", money:"0", time:"少", will:"否", stages:["student","early"], tags:[] },
      { id:"25-01", chapter:"25-人走了以後要辦什麼", title:"提前了解身後事基本流程（戶口、遺產、保險）", say:"家人突然面對時會手足無措。", cost:"花時間了解。", benefit:"減少緊急時的混亂", evidence:"B", money:"0", time:"中", will:"否", stages:["mid","senior"], tags:[] },
      { id:"28-01", chapter:"28-別為了外形把身體搞壞", title:"減肥與整形前先評估健康風險", say:"極端節食或不正規醫美可能造成長期傷害。", cost:"諮詢正規醫生。", benefit:"避免身體損害", evidence:"A", money:"少", time:"中", will:"些", stages:["student","early","mid"], tags:[] },
      { id:"29-01", chapter:"29-遭遇重大打擊之後", title:"重大打擊後允許自己求助", say:"孤立會延長恢復時間。", cost:"開口求助的心理成本。", benefit:"加快心理與生活恢復", evidence:"B", money:"0", time:"中", will:"些", stages:["early","mid","senior"], tags:[] },
      { id:"30-01", chapter:"30-上學以後的孩子", title:"關注孩子睡眠與戶外活動時間", say:"睡眠不足與缺乏運動影響身心發展。", cost:"家庭作息調整。", benefit:"更好的成長基礎", evidence:"A", money:"0", time:"中", will:"些", stages:["mid"], tags:["has_kids"] },
      { id:"33-01", chapter:"33-殘疾之後怎麼活", title:"了解殘疾人證與相關福利政策", say:"符合條件時應申請，這是法定權益。", cost:"辦理時間。", benefit:"獲得應有支持", evidence:"A", money:"0", time:"中", will:"否", stages:["early","mid","senior"], tags:[] }
    ];

    // ========== 狀態 ==========
    const STORAGE_KEY = "htlb_progress_v1";
    const PROFILE_KEY = "htlb_profile_v1";

    let profile = JSON.parse(localStorage.getItem(PROFILE_KEY) || "null");
    let progress = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");

    // ========== DOM ==========
    const setupEl = document.getElementById("setup");
    const mainEl = document.getElementById("main");
    const stageSel = document.getElementById("stage");
    const situationsEl = document.getElementById("situations");
    const startBtn = document.getElementById("startBtn");
    const listEl = document.getElementById("list");
    const statsEl = document.getElementById("stats");
    const searchEl = document.getElementById("search");
    const filterChapter = document.getElementById("filterChapter");
    const filterEvidence = document.getElementById("filterEvidence");
    const filterCost = document.getElementById("filterCost");
    const filterDone = document.getElementById("filterDone");
    const resetBtn = document.getElementById("resetProfile");
    const dailyCardEl = document.getElementById("dailyCard");

    // chips
    situationsEl.querySelectorAll(".chip").forEach(chip => {
      chip.addEventListener("click", () => chip.classList.toggle("active"));
    });

    function getSelectedSituations() {
      return [...situationsEl.querySelectorAll(".chip.active")].map(c => c.dataset.val);
    }

    startBtn.addEventListener("click", () => {
      profile = {
        stage: stageSel.value,
        situations: getSelectedSituations()
      };
      localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
      showMain();
    });

    resetBtn.addEventListener("click", () => {
      if (confirm("確定重設個人資料？（進度會保留）")) {
        localStorage.removeItem(PROFILE_KEY);
        profile = null;
        setupEl.classList.remove("hidden");
        mainEl.classList.add("hidden");
      }
    });

    function showMain() {
      setupEl.classList.add("hidden");
      mainEl.classList.remove("hidden");
      populateChapters();
      render();
    }

    // 如果已有 profile，直接進入
    if (profile) {
      stageSel.value = profile.stage || "mid";
      (profile.situations || []).forEach(s => {
        const chip = situationsEl.querySelector(`[data-val="${s}"]`);
        if (chip) chip.classList.add("active");
      });
      showMain();
    }

    function saveProgress() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    }

    function isRelevant(entry) {
      if (!profile) return true;
      // 階段匹配
      if (entry.stages && entry.stages.length && !entry.stages.includes(profile.stage)) {
        // 仍然顯示，但權重較低（這裡先全部顯示，之後可改成優先）
      }
      // 有 tags 的條目：如果用戶有對應情況就優先，沒有也不隱藏
      return true;
    }

    function score(entry) {
      let s = 0;
      if (profile && entry.stages && entry.stages.includes(profile.stage)) s += 10;
      if (profile && entry.tags) {
        entry.tags.forEach(t => {
          if ((profile.situations || []).includes(t)) s += 20;
        });
      }
      if (entry.evidence === "A") s += 5;
      if (entry.money === "0") s += 3;
      return s;
    }

    function populateChapters() {
      const chapters = [...new Set(ENTRIES.map(e => e.chapter))].sort();
      filterChapter.innerHTML = '<option value="">全部章節</option>' +
        chapters.map(c => `<option value="${c}">${c}</option>`).join("");
    }

    // 每日推薦：用日期做種子，同一天固定一條，優先未完成 + 高性價比
    function getDailyEntry() {
      const today = new Date().toISOString().slice(0, 10);
      const seed = today.split("-").reduce((a, b) => a + parseInt(b, 10), 0);
      const candidates = ENTRIES
        .filter(e => !progress[e.id])
        .sort((a, b) => {
          const sa = (a.evidence === "A" ? 10 : 0) + (a.money === "0" ? 5 : 0) + score(a);
          const sb = (b.evidence === "A" ? 10 : 0) + (b.money === "0" ? 5 : 0) + score(b);
          return sb - sa;
        });
      if (!candidates.length) return ENTRIES[seed % ENTRIES.length];
      return candidates[seed % candidates.length];
    }

    function renderDaily() {
      const e = getDailyEntry();
      if (!e) { dailyCardEl.innerHTML = ""; return; }
      const done = !!progress[e.id];
      dailyCardEl.innerHTML = `
        <div class="daily-label">今日推薦 · ${new Date().toLocaleDateString("zh-HK")}</div>
        <div class="daily-title">${e.title}</div>
        <p class="daily-say">${e.say}</p>
        <div class="daily-actions">
          <button class="btn btn-sm" id="dailyDoneBtn">${done ? "已完成 ✓" : "標記完成"}</button>
          <button class="btn btn-secondary btn-sm" id="dailyAnotherBtn">換一條</button>
          <span class="daily-meta">證據 ${e.evidence} · 錢：${e.money === "0" ? "不花" : e.money} · ${e.chapter}</span>
        </div>
      `;
      document.getElementById("dailyDoneBtn").addEventListener("click", () => {
        if (progress[e.id]) delete progress[e.id];
        else progress[e.id] = Date.now();
        saveProgress();
        render();
      });
      document.getElementById("dailyAnotherBtn").addEventListener("click", () => {
        // 臨時換一條（不影響「今日」種子，只係即時換）
        const others = ENTRIES.filter(x => x.id !== e.id && !progress[x.id]);
        const pick = others[Math.floor(Math.random() * others.length)] || e;
        dailyCardEl.dataset.tempId = pick.id;
        renderDailyTemp(pick);
      });
    }

    function renderDailyTemp(e) {
      const done = !!progress[e.id];
      dailyCardEl.innerHTML = `
        <div class="daily-label">臨時推薦</div>
        <div class="daily-title">${e.title}</div>
        <p class="daily-say">${e.say}</p>
        <div class="daily-actions">
          <button class="btn btn-sm" id="dailyDoneBtn">${done ? "已完成 ✓" : "標記完成"}</button>
          <button class="btn btn-secondary btn-sm" id="dailyAnotherBtn">再換一條</button>
          <span class="daily-meta">證據 ${e.evidence} · 錢：${e.money === "0" ? "不花" : e.money} · ${e.chapter}</span>
        </div>
      `;
      document.getElementById("dailyDoneBtn").addEventListener("click", () => {
        if (progress[e.id]) delete progress[e.id];
        else progress[e.id] = Date.now();
        saveProgress();
        render();
      });
      document.getElementById("dailyAnotherBtn").addEventListener("click", () => {
        const others = ENTRIES.filter(x => x.id !== e.id && !progress[x.id]);
        const pick = others[Math.floor(Math.random() * others.length)] || e;
        renderDailyTemp(pick);
      });
    }

    function getFiltered() {
      const q = (searchEl.value || "").trim().toLowerCase();
      const ch = filterChapter.value;
      const ev = filterEvidence.value;
      const cost = filterCost.value;
      const done = filterDone.value;

      return ENTRIES
        .filter(e => {
          if (q && !(e.title + e.say + e.chapter).toLowerCase().includes(q)) return false;
          if (ch && e.chapter !== ch) return false;
          if (ev && e.evidence !== ev) return false;
          if (cost === "0" && e.money !== "0") return false;
          if (cost === "少" && e.money !== "少" && e.money !== "0") return false;
          const isDone = !!progress[e.id];
          if (done === "todo" && isDone) return false;
          if (done === "done" && !isDone) return false;
          return isRelevant(e);
        })
        .sort((a, b) => score(b) - score(a));
    }

    function renderStats(items) {
      const total = items.length;
      const doneCount = items.filter(e => progress[e.id]).length;
      const pct = total ? Math.round((doneCount / total) * 100) : 0;
      statsEl.innerHTML = `
        <div class="stat-card"><div class="num">${total}</div><div class="label">目前顯示</div></div>
        <div class="stat-card"><div class="num">${doneCount}</div><div class="label">已完成</div></div>
        <div class="stat-card"><div class="num">${pct}%</div><div class="label">完成率</div></div>
        <div class="stat-card"><div class="num">${Object.keys(progress).length}</div><div class="label">累計打勾</div></div>
      `;
    }

    function render() {
      renderDaily();
      const items = getFiltered();
      renderStats(items);
      listEl.innerHTML = items.map(e => {
        const done = !!progress[e.id];
        return `
          <article class="item ${done ? "done" : ""}" data-id="${e.id}">
            <div class="item-header">
              <input type="checkbox" ${done ? "checked" : ""} data-id="${e.id}" />
              <div>
                <div class="item-title">${e.title}</div>
                <div class="item-meta">
                  <span class="tag ${e.evidence.toLowerCase()}">證據 ${e.evidence}</span>
                  <span class="tag ${e.money === "0" ? "cost0" : ""}">錢：${e.money === "0" ? "不花" : e.money}</span>
                  <span class="tag">時間：${e.time}</span>
                  <span class="tag">毅力：${e.will}</span>
                  <span class="tag">${e.chapter}</span>
                </div>
                <p class="say">${e.say}</p>
                <p class="cost-benefit"><strong>成本：</strong>${e.cost}　<strong>收益：</strong>${e.benefit}</p>
              </div>
            </div>
          </article>
        `;
      }).join("") || `<p style="color:var(--muted);padding:20px;">沒有符合條件的條目</p>`;

      // checkbox events
      listEl.querySelectorAll('input[type="checkbox"]').forEach(cb => {
        cb.addEventListener("change", () => {
          const id = cb.dataset.id;
          if (cb.checked) progress[id] = Date.now();
          else delete progress[id];
          saveProgress();
          render();
        });
      });
    }

    searchEl.addEventListener("input", render);
    filterChapter.addEventListener("change", render);
    filterEvidence.addEventListener("change", render);
    filterCost.addEventListener("change", render);
    filterDone.addEventListener("change", render);

    // 初始化章節下拉
    populateChapters();
  </script>
</body>
</html>
